        }
        .solar-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;

                email: '',
                date: '',
                time: '',
                address: ''

                if (userInput.trim()) {

                    setChatMessages(newMessages);
                    
                    // Simple bot response
                    setTimeout(() => {
                        let botResponse = '';
                        const input = userInput.toLowerCase();

                            botResponse = 'I can help you book an appointment! Please provide:\n1. Your name\n2. Phone number\n3. Preferred date and time\n4. Your address in Rajasthan';

                        }

                }
            };

                            <div className="border-t border-gray-800 mt-8 pt-8 text-center text-gray-400">
                                <p>&copy; 2024 Heaven Enterprises. All rights reserved. | Government Approved Solar Partner</p>
                            </div>
                        </div>
                    </footer>

                    {/* Chatbot */}
                    <div className="fixed bottom-6 right-6 z-50">
                        {isChatOpen && (
                            <div className="bg-white rounded-lg shadow-2xl w-80 h-96 mb-4 flex flex-col">
                                <div className="bg-solar-blue text-white p-4 rounded-t-lg flex justify-between items-center">
                                    <div>
                                        <h4 className="font-bold">Solar Assistant</h4>
                                        <p className="text-xs opacity-90">We typically reply in minutes</p>
                                    </div>
                                    <button 
                                        onClick={() => setIsChatOpen(false)}
                                        className="text-white hover:text-gray-200"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {chatMessages.map((msg, index) => (
                                        <div key={index} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-xs px-4 py-2 rounded-lg ${
                                                msg.type === 'user' 
                                                    ? 'bg-solar-blue text-white' 
                                                    : 'bg-gray-100 text-gray-800'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 border-t">
                                    <div className="flex space-x-2">
                                        <input 
                                            type="text" 
                                            placeholder="Type your message..."
                                            className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-solar-blue"
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                                        />
                                        <button 
                                            onClick={handleSendMessage}
                                            className="bg-solar-blue text-white px-4 py-2 rounded-lg hover:bg-blue-600"
                                        >
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <button 
                            onClick={() => setIsChatOpen(!isChatOpen)}
                            className="bg-solar-yellow text-solar-blue w-14 h-14 rounded-full shadow-lg hover:bg-yellow-400 transition-all chatbot-bubble flex items-center justify-center"
                        >
                            <i className="fas fa-comments text-xl"></i>
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
